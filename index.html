// 从78500.cn解析HTML
function parse78500(html) {
  const sections = html.split(/<section\s+class="item"/);
  const results = [];
  for (let i = 1; i < sections.length; i++) {
    const pm = sections[i].match(/<strong>(\d{7})期<\/strong>/);
    const dm = sections[i].match(/开奖时间\s+(\d{4}-\d{2}-\d{2})/);
    const nums = sections[i].match(/<i>(\d)<\/i>/g);
    if (pm && dm && nums && nums.length >= 5) {
      const digits = nums.map(n => parseInt(n.match(/\d/)[0]));
      results.push({ period: parseInt(pm[1].slice(2)), date: dm[1], n1: digits[0], n2: digits[1], n3: digits[2], n4: digits[3] });
    }
  }
  return results;
}

// 从体彩API解析JSON
function parseSporttery(json) {
  const list = json.value && json.value.list ? json.value.list : [];
  const results = [];
  for (const item of list) {
    if (item.lotteryGameNum === '35') continue; // 排列3
    const nums = (item.lotteryUnsortDrawresult || item.lotteryDrawResult || '').split(/\s+/).map(Number);
    if (nums.length >= 4 && !isNaN(nums[0])) {
      results.push({
        period: parseInt(item.lotteryDrawNum),
        date: item.lotteryDrawTime,
        n1: nums[0], n2: nums[1], n3: nums[2], n4: nums[3]
      });
    }
  }
  return results;
}

// 从JSONBin读取数据
async function fetchFromJSONBin() {
  try {
    const resp = await fetch(JSONBIN_URL, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    const json = await resp.json();
    return json.record && json.record.records ? json.record.records : null;
  } catch (e) {
    console.log('JSONBin fetch failed:', e);
    return null;
  }
}

// 写入JSONBin
async function pushToJSONBin(records) {
  try {
    const resp = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify({ records: records })
    });
    return resp.ok;
  } catch (e) {
    console.log('JSONBin push failed:', e);
    return false;
  }
}

// 从多个API获取最新数据
async function fetchLatestData() {
  for (const api of LOTTERY_APIS) {
    try {
      const resp = await fetch(api.url);
      if (api.type === 'html') {
        const html = await resp.text();
        const results = parse78500(html);
        if (results.length > 0) return results;
      } else {
        const json = await resp.json();
        const results = parseSporttery(json);
        if (results.length > 0) return results;
      }
    } catch (e) {
      console.log(api.name + ' fetch failed:', e);
    }
  }
  return [];
}

// 自动更新：检查是否有新数据
async function autoUpdate() {
  const latest = await fetchLatestData();
  if (!latest.length) return;
  const maxPeriod = data.length ? Math.max(...data.map(r => r.period)) : 0;
  const newOnes = latest.filter(r => r.period > maxPeriod);
  if (newOnes.length === 0) return;
  // 按期号排序，新数据插到前面
  newOnes.sort((a, b) => b.period - a.period);
  for (const r of newOnes) {
    data.unshift(r);
  }
  // 推送到JSONBin
  await pushToJSONBin(data);
  // 更新界面
  renderTable();
  updateStaircase();
}

  }

  await autoUpdate();
}

// 关系计算函数
function calcRelations(n1, n2, n3, n4) {
  const nums = [n1, n2, n3, n4];
  const hz = n1 + n2 + n3 + n4;
  const kd = Math.max(...nums) - Math.min(...nums);
  const ji = nums.filter(x => x % 2 === 1).length;
  const jiou = ji + ':' + (4 - ji);
  const da = nums.filter(x => x >= 5).length;
  const daxiao = da + ':' + (4 - da);
  const zh = nums.filter(x => [2, 3, 5, 7].includes(x)).length;
  const zhih = zh + ':' + (4 - zh);
  const lu0 = nums.filter(x => x % 3 === 0).length;
  const lu1 = nums.filter(x => x % 3 === 1).length;
  const lu2 = 4 - lu0 - lu1;
  const lu12 = lu0 + ':' + lu1 + ':' + lu2;
  const uniq = [...new Set(nums)];
  const diffs = new Set();
  for (let i = 0; i < uniq.length; i++)
    for (let j = i + 1; j < uniq.length; j++)
      diffs.add(Math.abs(uniq[i] - uniq[j]));
  const ac = uniq.length > 1 ? diffs.size - (uniq.length - 1) : 0;
  const cnt = {};
  nums.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  const zhonghao = Object.values(cnt).filter(v => v >= 2).length;
  const s = [...nums].sort((a, b) => a - b);
  const lian = s.reduce((a, v, i) => i > 0 && v - s[i-1] === 1 ? a + 1 : a, 0);
  const jiou_xt = nums.map(x => x % 2 === 1 ? '奇' : '偶').join('');
  const daxiao_xt = nums.map(x => x >= 5 ? '大' : '小').join('');
  const zhih_xt = nums.map(x => [2, 3, 5, 7].includes(x) ? '质' : '合').join('');
  const lu12_xt = nums.map(x => x % 3).join('');
  const swHe = n1 + n4;
  const swCha = Math.abs(n1 - n4);
  const zjHe = n2 + n3;
  return {hz, kd, jiou, daxiao, zhih, lu12, ac, zhonghao, lian, jiou_xt, daxiao_xt, zhih_xt, lu12_xt, swHe, swCha, zjHe};
}

// 渲染表格
function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  const filtered = data.filter(d => {
    const num = '' + d.n1 + d.n2 + d.n3 + d.n4;
    return d.period.toString().includes(search) || num.includes(search);
  });

  const rels = filtered.map(d => calcRelations(d.n1, d.n2, d.n3, d.n4));
  const relKeys = ['hz','kd','jiou','daxiao','zhih','lu12','ac','zhonghao','lian','jiou_xt','daxiao_xt','zhih_xt','lu12_xt','swHe','swCha','zjHe'];

  // Calculate total streak length each cell belongs to (look both directions)
  const streaks = rels.map((rel, idx) => {
    const s = {};
    relKeys.forEach(k => {
      let count = 1;
      for (let i = idx - 1; i >= 0; i--) {
        if (String(rels[i][k]) === String(rel[k])) count++;
        else break;
      }
      for (let i = idx + 1; i < rels.length; i++) {
        if (String(rels[i][k]) === String(rel[k])) count++;
        else break;
      }
      s[k] = count;
    });
    return s;
  });

  filtered.forEach((d, idx) => {
    const rel = rels[idx];
    const sk = streaks[idx];
    const num = '' + d.n1 + d.n2 + d.n3 + d.n4;
    const hlc = k => {
      if (sk[k] >= 4) return ' class="hl-red"';
      if (sk[k] === 3) return ' class="hl-green"';
      if (sk[k] === 2) return ' class="hl-yellow"';
      return '';
    };
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.period}</td>
      <td>${d.date}</td>
      <td class="num-cell">${num}</td>
      <td${hlc('hz')}>${rel.hz}</td>
      <td${hlc('kd')}>${rel.kd}</td>
      <td${hlc('jiou')}>${rel.jiou}</td>
      <td${hlc('daxiao')}>${rel.daxiao}</td>
      <td${hlc('zhih')}>${rel.zhih}</td>
      <td${hlc('lu12')}>${rel.lu12}</td>
      <td${hlc('ac')}>${rel.ac}</td>
      <td${hlc('zhonghao')}>${rel.zhonghao}</td>
      <td${hlc('lian')}>${rel.lian}</td>
      <td${hlc('jiou_xt')}>${rel.jiou_xt}</td>
      <td${hlc('daxiao_xt')}>${rel.daxiao_xt}</td>
      <td${hlc('zhih_xt')}>${rel.zhih_xt}</td>
      <td${hlc('lu12_xt')}>${rel.lu12_xt}</td>
      <td${hlc('swHe')}>${rel.swHe}</td>
      <td${hlc('swCha')}>${rel.swCha}</td>
      <td${hlc('zjHe')}>${rel.zjHe}</td>
      <td class="actions">
        <button class="btn-edit" onclick="editRecord(${idx})">编辑</button>
        <button class="btn-copy" onclick="copyRecord(${idx})">复制</button>
        <button class="btn-del" onclick="delRecord(${idx})">删除</button>
        <button class="btn-info" onclick="showTooltip(event)">!</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  
  document.getElementById('periodCount').textContent = data.length;
}

// 复制记录分析数据
function copyRecord(idx) {
  const d = data[idx];
  if (!d) return;
  const rel = calcRelations(d.n1, d.n2, d.n3, d.n4);
  const text = `和值${rel.hz} 跨度${rel.kd} 奇偶比${rel.jiou} 大小比${rel.daxiao} 质合比${rel.zhih} 012路比${rel.lu12} AC值${rel.ac} 重号${rel.zhonghao} 连号${rel.lian} 奇偶形态${rel.jiou_xt} 大小形态${rel.daxiao_xt} 质合形态${rel.zhih_xt} 012路形态${rel.lu12_xt} 首尾和${rel.swHe} 首尾差${rel.swCha} 中间和${rel.zjHe}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '已复制';
    btn.style.background = '#c8e6c9';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1200);
  });
}

function quickAdd() {

  const val = input.value.trim();
  if (!/^\d{4}$/.test(val)) { alert('请输入4位数字'); return; }
  const n1 = +val[0], n2 = +val[1], n3 = +val[2], n4 = +val[3];
  const maxP = Math.max(...data.map(r => r.period));
  const today = new Date().toISOString().slice(0, 10);
  data.unshift({period: maxP + 1, date: today, n1, n2, n3, n4});
  renderTable();
  updateStaircase();
  pushToJSONBin(data);
  input.value = '';
  });
}

// 阶梯筛选
let staircase = [];

function updateStaircase() {
  // Step 1: Build frequency table from current data
  const scoreKeys = ['hz','kd','jiou','daxiao','zhih','lu12','ac','zhonghao','lian','swHe','swCha','zjHe'];
  const freq = {};
  scoreKeys.forEach(k => freq[k] = {});
  data.forEach(d => {
    const rel = calcRelations(d.n1, d.n2, d.n3, d.n4);
    scoreKeys.forEach(k => {
      const v = String(rel[k]);
      freq[k][v] = (freq[k][v] || 0) + 1;
    });
  });
  
  // Step 2: Score all 10000 combos
  const totalData = data.length;
  const scored = [];
  for(let i = 0; i < 10000; i++){
    const n1 = Math.floor(i/1000), n2 = Math.floor((i%1000)/100), n3 = Math.floor((i%100)/10), n4 = i%10;
    const rel = calcRelations(n1, n2, n3, n4);
    let logScore = 0;
    let hasZero = false;
    for(const k of scoreKeys){
      const v = String(rel[k]);
      const count = freq[k][v] || 0;
      if(count === 0){ hasZero = true; break; }
      logScore += Math.log(count);
    }
    scored.push([i, hasZero ? 0 : logScore]);
  }
  // Sort by logScore ascending, then by combo number
  scored.sort((a,b) => a[1] !== b[1] ? a[1] - b[1] : a[0] - b[0]);
  
  // Update global comboScores
  comboScores = scored;
  
  // Step 3: Count zero-freq
  let zeroCount = 0;
  for(let i = 0; i < scored.length; i++){
    if(scored[i][1] === 0) zeroCount++;
    else break;
  }
  
  // Step 4: Build history combo set
  const histSet = new Set();
  data.forEach(d => histSet.add(d.n1*1000+d.n2*100+d.n3*10+d.n4));
  
  // Count how many historical combos in zero-freq zone
  let zeroKilled = 0;
  for(let i = 0; i < zeroCount; i++){
    if(histSet.has(scored[i][0])) zeroKilled++;
  }
  
  // Step 5: Build staircase
  let killed = zeroKilled;
  const staircase = zeroKilled === 0 
    ? [{kill:0, exclude:zeroCount, remain:10000-zeroCount}]
    : [];
  let lastKill = zeroKilled;
  
  // If zeroKilled > 0, we need to track when kill drops to 0 (shouldn't happen with clean data)
  // Actually: staircase starts from the minimum kill level
  if(zeroKilled > 0 && zeroKilled !== lastKill){
    // Already recorded
  }
  // Add the base entry
  if(staircase.length === 0){
    staircase.push({kill:zeroKilled, exclude:zeroCount, remain:10000-zeroCount});
  }
  
  for(let i = zeroCount; i < scored.length; i++){
    if(histSet.has(scored[i][0])) killed++;
    if(killed !== lastKill){
      staircase.push({kill:killed, exclude:i+1, remain:10000-i-1});
      lastKill = killed;
    }
  }
  
  // Step 6: Update dropdown
  const select = document.getElementById('killSelect');
  const prevValue = select.value;
  select.innerHTML = '';
  staircase.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.exclude;
    opt.textContent = item.kill + '个误杀(剩余' + item.remain + '个)';
    select.appendChild(opt);
  });
  
  // Try to keep previous selection or default to first
  const firstOpt = staircase[0];
  select.value = firstOpt.exclude;
  
  select.onchange = () => filterAndShow();
  filterAndShow();
}

function filterAndShow() {
  const excludeCount = parseInt(document.getElementById('killSelect').value) || 0;
  const remain = 10000 - excludeCount;
  document.getElementById('remainCount').textContent = remain;
  
  // Valid combos = comboScores.slice(excludeCount), sorted by score descending (most likely first)
  const valid = comboScores.slice(excludeCount);
  
  // Preview first 50
  const preview = valid.slice(0, 50).map(([num]) => {
    return String(num).padStart(4, '0');
  });
  document.getElementById('previewList').textContent = preview.join('  ');
}

function exportTXT() {
  const excludeCount = parseInt(document.getElementById('killSelect').value) || 0;
  const valid = comboScores.slice(excludeCount);
  
  let lines = [];
  for(let i = 0; i < valid.length; i += 10){
    const chunk = valid.slice(i, i+10).map(([num]) => String(num).padStart(4, '0'));
    lines.push(chunk.join(' '));
  }
  const txt = lines.join('\n');
  const blob = new Blob([txt], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = valid.length + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function copyPreview() {
  const text = document.getElementById('previewList').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// 遗漏统计
function queryMiss() {
  const n = parseInt(document.getElementById('missInput').value) || 0;
  const result = document.getElementById('missResult');
  
  // 统计历史中各特征的最大遗漏
  const historyMap = {};
  
  // 按顺序记录每个特征值
  const sequences = {
    'hz': [], 'kd': [], 'jiou': [], 'daxiao': [], 'zhih': [],
    'lu12': [], 'ac': [], 'zhonghao': [], 'lian': [],
    'jiou_xt': [], 'daxiao_xt': [], 'zhih_xt': [], 'lu12_xt': []
  };
  
  data.forEach(d => {
    const rel = calcRelations(d.n1, d.n2, d.n3, d.n4);
    for (const k of Object.keys(sequences)) {
      sequences[k].push(rel[k]);
    }
  });
  
  // 计算每个特征值的遗漏
  const missStats = {};
  for (const [key, seq] of Object.entries(sequences)) {
    const seen = {};
    seq.forEach((v, i) => {
      if (!seen[v] !== undefined) {
        seen[v] = i;
      }
    });
    
    // 计算当前遗漏
    const lastIdx = seq.findIndex((v, i, arr) => i === arr.lastIndexOf(v));
    const currentMiss = seq.length - 1 - lastIdx;
    
    // 统计历史最大遗漏
    for (let i = 0; i < seq.length; i++) {
      const v = seq[i];
      if (!missStats[v]) missStats[v] = {count: 0, maxMiss: 0, lastMiss: 0};
      missStats[v].count++;
    }
    
    // 遍历找最大遗漏
    const valIndices = {};
    seq.forEach((v, i) => {
      if (!valIndices[v]) valIndices[v] = [];
      valIndices[v].push(i);
    });
    
    for (const [v, indices] of Object.entries(valIndices)) {
      let maxM = 0;
      for (let i = 1; i < indices.length; i++) {
        maxM = Math.max(maxM, indices[i] - indices[i-1] - 1);
      }
      // 当前遗漏
      const lastIdx2 = indices[indices.length - 1];
      const currM = seq.length - 1 - lastIdx2;
      if (!missStats[v]) missStats[v] = {count: 0, maxMiss: 0, currentMiss: 0};
      missStats[v].maxMiss = Math.max(missStats[v].maxMiss, maxM);
      missStats[v].currentMiss = Math.max(missStats[v].currentMiss || 0, currM);
    }
  }
  
  // 只显示历史出现过的值
  const filtered = Object.entries(missStats)
    .filter(([v, s]) => s.count >= 1 && s.currentMiss >= n)
    .sort((a, b) => b[1].currentMiss - a[1].currentMiss);
  
  let html = '';
  filtered.slice(0, 100).forEach(([v, s]) => {
    const cls = s.currentMiss > 20 ? 'miss-high' : s.currentMiss > 10 ? 'miss-medium' : '';
    html += `<div class="miss-item ${cls}"><span>特征值: ${v}</span><span>当前遗漏: ${s.currentMiss}期</span></div>`;
  });
  
  result.innerHTML = html || '<div style="padding:15px;color:#999;">无符合条件的记录</div>';
}
