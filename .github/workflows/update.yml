name: 四数关系更新
on:
  schedule:
    - cron: '40 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行数据更新脚本
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update.py
