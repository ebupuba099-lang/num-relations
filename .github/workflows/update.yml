name: 四数关系分析更新
on:
  schedule:
    - cron: '40 13 * * *'
  workflow_dispatch:

jobs:

permissions:
  contents: write
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行更新脚本
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/update.py
      - name: 同步数据到仓库
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: b63a528e91eba6d15dd3da06056dab0f
        run: |
          python3 -c "
          import json, urllib.request, os
          req = urllib.request.Request(
              f'https://api.github.com/gists/' + os.environ['GIST_ID'],
              headers={'Authorization': 'token ' + os.environ['GIST_TOKEN']}
          )
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = data['files']['relations_data.json']['content']
          os.makedirs('data', exist_ok=True)
          with open('data/relations_data.json', 'w') as f:
              f.write(content)
          print('Synced data from Gist')
          "
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relations_data.json
          git diff --cached --quiet || git commit -m "auto: sync data from Gist"
          git push
